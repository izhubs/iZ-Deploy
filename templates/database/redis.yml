# Redis 1-Click Docker Compose Template
# izDeploy Template Catalog: Database / Cache
services:
  redis:
    image: redis:7-alpine
    container_name: izdeploy-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    volumes:
      - izdeploy-redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  izdeploy-redis-data:
    name: izdeploy-redis-data
