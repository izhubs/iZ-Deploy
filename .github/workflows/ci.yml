name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build & Test Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -v -race ./...

      - name: Compile izdeploy CLI
        run: go build -v -o bin/izdeploy ./cmd/izdeploy

      - name: Compile izdeploy-agent daemon
        run: go build -v -o bin/izdeploy-agent ./cmd/izdeploy-agent

      - name: Compile izdeploy-watchdog rescue binary
        run: go build -v -o bin/izdeploy-watchdog ./cmd/izdeploy-watchdog
